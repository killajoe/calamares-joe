# Calamares module for activating COSMIC + greetd autologin
---
dontChroot: false
timeout: 10

i18n:
    name: "Configuring COSMIC autologin..."

script:
    # Check if the user selected the autologin option in the installer GUI.
    # Since the upstream displaymanager module skips greetd autologin, 
    # we evaluate the global Calamares variables manually here.
    - "-if [ \"${autologin}\" = \"true\" ] || [ -n \"${autologinUser}\" ]; then
        echo '==> Enabling autologin for COSMIC Desktop...';
        
        CONFIG_FILE=\"/etc/greetd/config.toml\";
        
        if [ -f \"$CONFIG_FILE\" ]; then
            # Rewrite the configuration. 
            # initial_session boots straight to desktop, default_session handles logout.
            cat <<EOF > \"$CONFIG_FILE\"
[terminal]
vt = 7

[initial_session]
command = \"start-cosmic\"
user = \"${username}\"

[default_session]
command = \"cosmic-comp cosmic-greeter\"
user = \"cosmic-greeter\"
EOF
            echo '==> Autologin configuration written successfully.';
        else
            echo '==> Error: /etc/greetd/config.toml not found!';
        fi
       else
        echo '==> Autologin not requested by the user. Skipping modification.';
       fi"
